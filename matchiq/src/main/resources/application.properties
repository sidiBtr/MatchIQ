spring.application.name=matchiq

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/matchiq_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Application server
server.port=8080
football.api.base-url=https://v3.football.api-sports.io
football.api.key=${FOOTBALL_API_KEY}
openai.api.key = ${OPEN_AI_API_KEY}
openai.api.url=https://api.openai.com/v1/responses
server.error.include-message=never
server.error.include-stacktrace=never
matchiq.jwt.secret=${MATCH_IQ_JWT_SECRET}
matchiq.jwt.expiration-seconds=3600



